name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch/PR cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  # The Electron postinstall downloads a ~100 MB binary; nothing here needs it.
  ELECTRON_SKIP_BINARY_DOWNLOAD: 1

jobs:
  check:
    name: typecheck, build, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/web/package-lock.json

      # GrepTool shells out to `rg`; the runner image does not ship it.
      - name: Install ripgrep
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep

      - name: Install dependencies
        run: |
          npm ci --ignore-scripts
          npm ci --ignore-scripts --prefix client/web

      - name: Typecheck server
        run: npx tsc --noEmit -p src/tsconfig.json

      - name: Build web client
        run: npm run build:web

      - name: Test
        run: npm test

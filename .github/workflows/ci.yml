name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch/PR cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  # The Electron postinstall downloads a ~100 MB binary; nothing here needs it.
  ELECTRON_SKIP_BINARY_DOWNLOAD: 1

jobs:
  check:
    name: format, lint, typecheck, build, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      # GrepTool shells out to `rg`; the runner image does not ship it.
      - name: Install ripgrep
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep

      # One lockfile: web, protocol and sdks/typescript are npm workspaces.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build web client
        run: npm run build:web

      - name: Test
        run: npm test

      # The deploy seed carries a copy of the echarts skill; fail if it drifts
      # from the source under .ai-agent/skills.
      - name: Check echarts skill is in sync
        run: npm run check:echarts-skill

      # Per-tool coverage gate over the coding-tools suite (c8 + vitest).
      - name: Coding tools coverage
        run: npm run coverage:tools

## nginx STATIC-ONLY config — the web image's default (baked at
## /etc/nginx/conf.d/default.conf by deploy/Dockerfile.web).
##
## Used by BOTH deploy modes (admin + sso), where the frontend and the agent
## (and, in sso, the external auth-service) run on DIFFERENT ORIGINS. This
## server serves only the built SPA + its runtime config; it has NO upstream
## to the agent and NO /sso proxy. The browser talks to:
##
##   • the agent      directly at API_BASE  (cross-origin, CORS [+ bearer JWT in sso])
##   • the auth-service directly at AUTH_BASE (cross-origin SSO redirects, sso only)
##
## Because there is no `upstream agent`, this container starts even when no
## agent service is reachable on the same network.

server {
    listen 80 default_server;
    server_name _;

    # Optional Basic Auth (generated from WEB_PASSWORD at startup). In SSO the
    # auth-service is the real gate, so WEB_PASSWORD is normally unset → empty.
    include /etc/nginx/conf.d/auth.inc;

    # Container healthcheck — never gated.
    location = /healthz {
        auth_basic off;
        access_log off;
        return 200 "ok\n";
    }

    # Runtime SPA config — regenerated per deploy from AUTH_ENABLED / API_BASE /
    # AUTH_BASE / REMOTE_ENABLED; must NOT inherit the immutable *.js cache.
    location = /app-config.js {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ── UI static assets + SPA fallback ────────────────────────────────
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;

        location ~* \.(?:js|css|woff2?|svg|png|jpg|jpeg|gif|ico)$ {
            access_log off;
            expires    7d;
            add_header Cache-Control "public, max-age=604800, immutable";
        }
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }
}

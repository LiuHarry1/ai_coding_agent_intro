# ─────────────────────────────────────────────────────────────────────────

# DEPLOY MODE 1 — Shared password gate (HTTP Basic Auth)

#

#   • One shared username/password protects the whole site (UI + API +

#     preview), enforced by nginx in the web image.

#   • Users CAN freely switch workspace (no per-user pinning).

#

# Use this when you want a single "front door" password for a small, trusted

# group. Rotate the password by changing WEB_PASSWORD and re-running up -d.

#

# Bring up:

#   docker compose -f deploy/docker-compose.password.yml --env-file deploy/.env up -d

# Open:

#   http://localhost:${WEB_PORT:-9999}   (login: WEB_USERNAME / WEB_PASSWORD)

#

# Analytics (telemetry) runs in the same compose network at http://analytics:8200.

# Reuses your existing MySQL (knowbot DB) — set MYSQL_* in deploy/.env.

# Daily token quota requires SSO (docker-compose.sso.yml), not this mode.

# ─────────────────────────────────────────────────────────────────────────



services:

  analytics:

    image: agent-analytics:latest

    build: ../analytics

    extra_hosts:

      - "host.docker.internal:host-gateway"

    ports:

      - "${ANALYTICS_PORT:-8200}:8200"

    environment:

      ANALYTICS_DATABASE_URL: ""

      MYSQL_HOST: "${MYSQL_HOST:-host.docker.internal}"

      MYSQL_PORT: "${MYSQL_PORT:-3306}"

      MYSQL_USER: "${MYSQL_USER:-root}"

      MYSQL_PASSWORD: "${MYSQL_PASSWORD:-root}"

      MYSQL_DATABASE: "${MYSQL_DATABASE:-knowbot}"

      ANALYTICS_INGEST_API_KEY: "${ANALYTICS_INGEST_API_KEY:-}"

      ANALYTICS_QUERY_API_KEY: "${ANALYTICS_QUERY_API_KEY:-}"

      ANALYTICS_DEFAULT_DAILY_TOKEN_LIMIT: "${ANALYTICS_DEFAULT_DAILY_TOKEN_LIMIT:-0}"

    restart: unless-stopped

    healthcheck:

      test:

        ["CMD", "python", "-c",

         "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8200/healthz').status==200 else 1)"]

      interval: 15s

      timeout: 5s

      retries: 5

      start_period: 20s



  agent:

    image: ai-agent-tenant:latest

    expose:

      - "4567"

    environment:

      NODE_ENV: production

      PORT: "4567"

      WORKSPACE: /workspace

      # ── Analytics telemetry (optional) ───────────────────────────────

      ANALYTICS_URL: "${ANALYTICS_URL:-http://analytics:8200}"

      ANALYTICS_INGEST_API_KEY: "${ANALYTICS_INGEST_API_KEY:-}"

      # ── Provider secrets ─────────────────────────────────────────────

      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"

      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"

      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"

      GOOGLE_GENERATIVE_AI_API_KEY: "${GOOGLE_GENERATIVE_AI_API_KEY:-}"

      # ── Preview ──────────────────────────────────────────────────────

      PREVIEW_ENABLED: "1"

      PUBLIC_BASE_URL: "${PUBLIC_BASE_URL:-http://localhost:9999}"

      SEARXNG_URL: "${SEARXNG_URL:-http://localhost:8888}"

      WEB_SEARCH_PROVIDER: "${WEB_SEARCH_PROVIDER:-exa}"

      PREVIEW_PATH_PREFIX: "/preview"

      PREVIEW_PORT_MIN: "3000"

      PREVIEW_PORT_MAX: "9998"

    volumes:

      - ../workspaces:/workspace:rw

      # Chat history (.sessions/*.jsonl) — survives container recreate/redeploy.

      - ../sessions:/app/.sessions:rw

    depends_on:

      analytics:

        condition: service_healthy

    restart: unless-stopped

    healthcheck:

      test:

        ["CMD", "node", "-e",

         "require('http').get('http://127.0.0.1:4567/health',(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]

      interval: 30s

      timeout: 5s

      retries: 3

      start_period: 15s



  web:

    image: ai-agent-web:latest

    environment:

      # ── Password gate ON ─────────────────────────────────────────────

      # WEB_PASSWORD is non-empty here → nginx requires Basic Auth before

      # serving anything. Override via host env or a .env beside this file.

      WEB_USERNAME: "${WEB_USERNAME:-admin}"

      WEB_PASSWORD: "${WEB_PASSWORD:-admin}"

    ports:

      - "${WEB_PORT:-9999}:80"

    depends_on:

      agent:

        condition: service_started

    restart: unless-stopped

    healthcheck:

      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/healthz"]

      interval: 30s

      timeout: 5s

      retries: 3



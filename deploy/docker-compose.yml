# Deployment compose for the coding agent + web frontend.
#
# This file is IMAGE-ONLY — no `build:` blocks. The workflow is:
#
#   1. Build the two images manually (from repo root):
#        docker build -f deploy/Dockerfile.agent -t ai-agent:latest .
#        docker build -f deploy/Dockerfile.web   -t ai-agent-web:latest .
#
#   2. Bring the stack up:
#        docker compose -f deploy/docker-compose.yml up -d
#
#   3. Open the UI:
#        open http://localhost:8080
#
# To rebuild after code changes: re-run the `docker build` for whichever
# side changed, then `docker compose ... up -d` again — compose will
# recreate only the affected container.

services:
  agent:
    image: ai-agent:latest
    # `expose` (not `ports`) — agent is reachable only from inside the
    # compose network. All external traffic goes through nginx (web).
    expose:
      - "4567"
    environment:
      NODE_ENV: production
      PORT: "4567"
    restart: unless-stopped
    healthcheck:
      test:
        ["CMD", "node", "-e",
         "require('http').get('http://127.0.0.1:4567/health',(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  web:
    image: ai-agent-web:latest
    ports:
      # Host:container. Change the left side (8080) to publish on a
      # different host port. For TLS, terminate it in a sidecar in front
      # of nginx (traefik / caddy / cloud LB) — keep nginx on :80 inside
      # the container.
      - "8080:80"
    depends_on:
      agent:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

# ─────────────────────────────────────────────────────────────────────────
# DEPLOY MODE 3 — SSO login (EXTERNAL auth-service) + per-user pinned workspace
#
#   • Users log in through your already-deployed auth-service (HS256 JWT).
#     No login, no access.
#   • Each user is PINNED to /workspace/users/<slug(email)> — created on
#     first request, enforced server-side. They CANNOT switch workspace
#     (the UI switcher is hidden and the API ignores client-sent paths).
#   • The shared password gate (Basic Auth) is OFF here.
#
# This stack runs ONLY the agent + web. The auth-service + its database are
# deployed separately; nginx just reverse-proxies /sso/* and /api/auth/* to
# AUTH_SERVICE_URL, so the browser stays on one origin.
#
# Required setup:
#   • JWT_SECRET MUST equal the secret your auth-service signs with — that
#     is the trust anchor (the agent verifies tokens, no DB/network).
#   • On the auth-service, add this web origin (PUBLIC_ORIGIN) to both
#     SSO_ALLOWED_RETURN_ORIGINS and CORS_ALLOWED_ORIGINS.
#
# Bring up:
#   docker compose -f deploy/docker-compose.sso.yml --env-file deploy/.env up -d
# Open:
#   ${PUBLIC_ORIGIN}   (defaults to http://localhost:8090)
# ─────────────────────────────────────────────────────────────────────────

services:
  agent:
    image: ai-agent-tenant:latest
    expose:
      - "4567"
    environment:
      NODE_ENV: production
      PORT: "4567"
      WORKSPACE: /workspace
      # ── Auth + per-user workspace pinning ────────────────────────────
      AUTH_ENABLED: "true"
      # MUST match the external auth-service's secret. Required.
      JWT_SECRET: "9afd313591dc5a84dcf3022cb9f9bea05023672ca24716d1d7d9743d9be5d95d"
      JWT_ALGORITHM: "HS256"
      # Parent dir for per-user workspaces; under the bind mount so each
      # user's files persist on the host.
      USERS_ROOT: /workspace/users
      # ── Provider secrets ─────────────────────────────────────────────
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
      GOOGLE_GENERATIVE_AI_API_KEY: "${GOOGLE_GENERATIVE_AI_API_KEY:-}"
      # ── Preview ──────────────────────────────────────────────────────
      # MUST match the web service's published origin (the ${WEB_PORT} below),
      # otherwise preview links point at a port nothing is listening on.
      PREVIEW_ENABLED: "1"
      PUBLIC_BASE_URL: "${PUBLIC_BASE_URL:-http://localhost:8080}"
      SEARXNG_URL: "${SEARXNG_URL:-http://localhost:8888}"
      PREVIEW_PATH_PREFIX: "/preview"
      PREVIEW_PORT_MIN: "3000"
      PREVIEW_PORT_MAX: "9998"
    volumes:
      - ../workspaces:/workspace:rw
    restart: unless-stopped
    healthcheck:
      test:
        ["CMD", "node", "-e",
         "require('http').get('http://127.0.0.1:4567/health',(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  web:
    image: ai-agent-web:latest
    environment:
      # Turns on the SPA's SSO login flow (window.__APP_CONFIG__.authEnabled).
      AUTH_ENABLED: "true"
      # External auth-service that nginx proxies /sso + /api/auth to.
      AUTH_SERVICE_URL: "${AUTH_SERVICE_URL:-http://localhost:52320}"
      # WEB_PASSWORD intentionally unset → Basic Auth OFF (login = auth-service).
    ports:
      - "${WEB_PORT:-8090}:80"
    depends_on:
      agent:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

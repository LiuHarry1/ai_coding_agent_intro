# ─────────────────────────────────────────────────────────────────────────
# DEPLOY MODE: sso — FULLY SEPARATED frontend / backend, SSO login
#
# Unlike the admin mode (single origin, nginx reverse-proxies everything),
# this stack runs the frontend and backend as INDEPENDENT services on THREE
# different origins:
#
#       browser
#         │  loads SPA            ┌──────────────┐
#         ├──────────────────────▶│  web (nginx) │   static SPA only,
#         │   ${FRONTEND_ORIGIN}  └──────────────┘   no proxy to agent
#         │
#         │  Bearer JWT, CORS     ┌──────────────┐
#         ├──────────────────────▶│    agent     │   headless API
#         │   ${AGENT_PUBLIC_URL} └──────┬───────┘   (SERVE_STATIC=0)
#         │                              │ quota
#         │  SSO redirects        ┌──────▼───────┐   ┌───────────┐
#         └──────────────────────▶│ auth-service │   │ analytics │
#             ${AUTH_PUBLIC_URL}   │  (external)  │   └───────────┘
#                                  └──────────────┘
#
#   • The web image serves ONLY the built SPA (nginx.static.conf — no agent
#     upstream, no /sso proxy). It can be deployed/scaled on its own host/CDN.
#   • The browser calls the agent directly at API_BASE (cross-origin → the
#     agent must allow ${FRONTEND_ORIGIN} via ALLOWED_ORIGINS) and redirects
#     to the auth-service directly at AUTH_BASE for login.
#   • Each user is PINNED to /workspace/users/<slug(email)>, enforced
#     server-side. The workspace switcher is hidden; client-sent paths ignored.
#   • SSO filesystem policy is dontAsk + pinned working dir: File tools and
#     /workspace HTTP refuse paths outside the user dir (application-layer;
#     bash is not OS-isolated).
#
# Required setup (split-origin):
#   • JWT_SECRET MUST equal the secret your auth-service signs with — that is
#     the trust anchor (the agent verifies tokens statelessly, no DB/network).
#   • On the auth-service, add ${FRONTEND_ORIGIN} to BOTH
#     SSO_ALLOWED_RETURN_ORIGINS and CORS_ALLOWED_ORIGINS.
#   • Set the three public origins in deploy/.env:
#       FRONTEND_ORIGIN   = https://app.example.com   (where the SPA is served)
#       AGENT_PUBLIC_URL  = https://agent.example.com  (browser → agent API)
#       AUTH_PUBLIC_URL   = https://auth.example.com   (browser → auth-service)
#
# NOTE: web preview (generated dev-server apps) is DISABLED in this mode —
# it needs a path-based proxy in front of the agent's dynamic ports, which
# the single-origin admin mode provides but a split deployment does not.
#
# Bring up:
#   docker compose -f deploy/docker-compose.sso.yml --env-file deploy/.env up -d
# Open:
#   ${FRONTEND_ORIGIN}   (defaults to http://localhost:8090)
# ─────────────────────────────────────────────────────────────────────────

services:
  analytics:
    image: agent-analytics:latest
    ports:
      - "${ANALYTICS_PORT:-8200}:8200"
    environment:
      MYSQL_HOST: "${MYSQL_HOST:-localhost}"
      MYSQL_PORT: "${MYSQL_PORT:-3306}"
      MYSQL_USER: "${MYSQL_USER:-root}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:-xxx}"
      MYSQL_DATABASE: "${MYSQL_DATABASE:-knowbot}"
    restart: unless-stopped
    healthcheck:
      test:
        ["CMD", "python", "-c",
         "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8200/healthz').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s


  agent:
    image: ai-agent-tenant:latest 
    # Published (NOT just `expose`) — in split mode the browser reaches the
    # agent directly at ${AGENT_PUBLIC_URL}, which must map to this port.
    ports:
      - "${AGENT_PORT:-4567}:4567"
    environment:
      NODE_ENV: production
      PORT: "4567"
      WORKSPACE: /workspace
      # ── UTF-8 locale: log lines contain CJK user text; without a UTF-8
      #    locale, shells/pagers inside the container render them as <E4><BD>…
      LANG: "C.UTF-8"
      LC_ALL: "C.UTF-8"
      # ── Headless: do NOT serve the SPA; the web service owns the frontend ─
      SERVE_STATIC: "0"
      # ── CORS allowlist: the browser calls this API from the web origin ────
      # Must list every frontend origin that talks to this agent.
      ALLOWED_ORIGINS: "${FRONTEND_ORIGIN:-http://localhost:8090}"
      # ── Public URL for ECharts preview links (GET /workspace/preview) ───
      AGENT_PUBLIC_URL: "${AGENT_PUBLIC_URL:-http://localhost:4567}"
      # ── Auth + per-user workspace pinning ────────────────────────────────
      AUTH_ENABLED: "true"
      # MUST match the external auth-service's secret. Required.
      JWT_SECRET: "9afd313591dc5a84dcf3022cb9f9bea05023672ca24716d1d7d9743d9be5d95d"
      JWT_ALGORITHM: "HS256"
      USERS_ROOT: /workspace/users
      WORKSPACE_SEED_DIR: "/opt/workspace-seed"
      # SSO isolation is AUTH_ENABLED + pinned user workspace (dontAsk).
      # File tools refuse paths outside the pinned dir. Bash is NOT OS-isolated.
      # ── Analytics + daily token quota (optional) ─────────────────────────
      QUOTA_ENABLED: "${QUOTA_ENABLED:-false}"
      ANALYTICS_URL: "${ANALYTICS_URL:-http://analytics:8200}"
      ANALYTICS_INGEST_API_KEY: "${ANALYTICS_INGEST_API_KEY:-}"
      # ── Provider secrets ─────────────────────────────────────────────────
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
      GOOGLE_GENERATIVE_AI_API_KEY: "${GOOGLE_GENERATIVE_AI_API_KEY:-}"
      # ── Preview proxy removed (PublishPreview deleted) ────────────────────
      SEARXNG_URL: "${SEARXNG_URL:-http://localhost:8888}"
      WEB_SEARCH_PROVIDER: "${WEB_SEARCH_PROVIDER:-exa}"
    volumes:
      - ./workspaces:/workspace:rw
      # Chat history (.sessions/*.jsonl) — survives container recreate/redeploy.
      - ./sessions:/app/.sessions:rw
    depends_on:
      analytics:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        ["CMD", "node", "-e",
         "require('http').get('http://127.0.0.1:4567/health',(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  web:
    image: ai-agent-web:latest
    # The image serves the SPA as a static site (nginx.static.conf is baked
    # in) — no agent upstream and no /sso proxy, so this container is fully
    # independent of the agent and starts even if the agent is unreachable.
    # RHEL7/CentOS7 (kernel 3.10) + nginx 1.31+: default seccomp blocks
    # pwrite(/run/nginx.pid). Prefer rebuilding with nginx:1.25-alpine
    # (Dockerfile.web); this is a runtime fallback.
    security_opt:
      - seccomp:unconfined
    environment:
      # Turns on the SPA's SSO login flow (window.__APP_CONFIG__.authEnabled).
      AUTH_ENABLED: "true"
      # Hide Remote SSH picker in tenant SSO deploys.
      REMOTE_ENABLED: "false"
      # Browser → agent API origin (cross-origin). Baked into app-config.js.
      API_BASE: "${AGENT_PUBLIC_URL:-http://localhost:4567}"
      # Browser → auth-service origin for /sso/authorize + /sso/logout.
      # NOTE: the static web image's web-runtime-config.sh reads AUTH_BASE
      # (NOT AUTH_SERVICE_URL — that's the single-origin admin proxy's var).
      # If left empty the SPA redirects SSO to its own origin and loops.
      AUTH_BASE: "${AUTH_BASE:-http://localhost:52320}"
      # WEB_PASSWORD intentionally unset → Basic Auth OFF (login = auth-service).
    ports:
      - "${WEB_PORT:-8090}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

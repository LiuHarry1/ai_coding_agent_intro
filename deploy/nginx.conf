## nginx reverse proxy: UI static + API/SSE passthrough to the agent.
##
## Listens on :80 inside the container. The compose file maps the host
## port (default 8080) so both your UI and "other internal projects" hit
## a single origin — no CORS, no port juggling.
##
## SSE notes:
##   - `proxy_buffering off` is mandatory; without it nginx waits for
##     full chunks before flushing and your text_delta stream looks
##     "stuck" until the agent finishes.
##   - `proxy_read_timeout 1d` keeps long agent runs from being killed
##     by nginx's 60s default. Adjust per your expected max turn length.
##   - HTTP/1.1 + empty Connection header are required for chunked
##     streaming through upstreams.

upstream agent_backend {
    server agent:4567;
    keepalive 16;
}

# Block reserved ports from the preview proxy (agent API, etc.)
map $preview_port $preview_forbidden {
    default 0;
    4567    1;
}

server {
    listen 80 default_server;
    server_name _;

    # Docker embedded DNS — required when proxy_pass uses a variable port.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # nginx's own healthcheck (Docker HEALTHCHECK uses this)
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # ── API surface forwarded to the agent backend ─────────────────────
    # Add/remove paths here as you grow the API. Keep this list explicit
    # rather than blanket-proxying so static assets never accidentally
    # leak through to the agent.
    location ~ ^/(chat|sessions|skills|agents|workspace|health|settings|mcp|ask_user_question)(/|$) {
        proxy_pass http://agent_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # SSE-friendly
        proxy_buffering        off;
        proxy_cache            off;
        proxy_read_timeout     1d;
        proxy_send_timeout     1d;

        # Generous body limit for image attachments in /chat
        client_max_body_size   25m;
    }

    # ── Dev-server preview (cloud deploy only) ─────────────────────────
    # Routes /preview/5173/ → agent:5173, /preview/3000/ → agent:3000, etc.
    # Agent container must bind dev servers to 0.0.0.0. Port range 3000-9999.
    location ~ ^/preview/(?<preview_port>[3-9][0-9]{3})(?<preview_path>/.*)?$ {
        if ($preview_forbidden = 1) {
            return 403;
        }

        set $preview_upstream agent;

        proxy_pass http://$preview_upstream:$preview_port$preview_path$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        proxy_buffering        off;
        proxy_cache            off;
        proxy_read_timeout     1d;
        proxy_send_timeout     1d;
    }

    # ── UI static assets + SPA fallback ────────────────────────────────
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;

        # Hashed Vite bundle files can be cached aggressively. The
        # `index.html` shell stays short-lived so a redeploy is picked
        # up on the next refresh.
        location ~* \.(?:js|css|woff2?|svg|png|jpg|jpeg|gif|ico)$ {
            access_log off;
            expires    7d;
            add_header Cache-Control "public, max-age=604800, immutable";
        }
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }
}

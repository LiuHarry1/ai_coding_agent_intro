<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        color-scheme: light dark;
        --border: color-mix(in srgb, currentColor 18%, transparent);
        --muted: color-mix(in srgb, currentColor 55%, transparent);
      }
      body {
        width: 320px;
        margin: 0;
        padding: 14px;
        font: 13px/1.45 system-ui, -apple-system, sans-serif;
      }
      h1 {
        font-size: 13px;
        font-weight: 600;
        margin: 0 0 10px;
      }
      .status {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 10px;
        border: 1px solid var(--border);
        border-radius: 6px;
        margin-bottom: 12px;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #999;
        flex: 0 0 auto;
      }
      .dot.connected { background: #2ea043; }
      .dot.rejected,
      .dot.disconnected { background: #d1242f; }
      .dot.unpaired { background: #bf8700; }
      .status-text { min-width: 0; }
      .status-label { font-weight: 600; text-transform: capitalize; }
      .status-detail {
        color: var(--muted);
        font-size: 11.5px;
        overflow-wrap: anywhere;
      }
      label {
        display: block;
        font-size: 11.5px;
        color: var(--muted);
        margin: 0 0 3px;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 6px 8px;
        font: 12px/1.3 ui-monospace, SFMono-Regular, Menlo, monospace;
        border: 1px solid var(--border);
        border-radius: 5px;
        background: transparent;
        color: inherit;
        margin-bottom: 8px;
      }
      button {
        font: inherit;
        padding: 6px 12px;
        border: 1px solid var(--border);
        border-radius: 5px;
        background: transparent;
        color: inherit;
        cursor: pointer;
      }
      button.primary {
        background: #2563eb;
        border-color: #2563eb;
        color: #fff;
      }
      .row { display: flex; gap: 8px; align-items: center; }
      .section { margin-top: 14px; }
      .section h2 {
        font-size: 11.5px;
        font-weight: 600;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.04em;
        margin: 0 0 6px;
      }
      ul { list-style: none; padding: 0; margin: 0; }
      li {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 5px 0;
        border-bottom: 1px dashed var(--border);
      }
      li:last-child { border-bottom: 0; }
      .tab-title {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .empty { color: var(--muted); font-size: 12px; }
      .hint {
        margin-top: 12px;
        font-size: 11.5px;
        color: var(--muted);
      }
      code {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11px;
      }
    </style>
  </head>
  <body>
    <h1>Baize Agent Browser Bridge</h1>

    <div class="status">
      <span class="dot" id="dot"></span>
      <span class="status-text">
        <span class="status-label" id="status">…</span>
        <span class="status-detail" id="detail"></span>
      </span>
    </div>

    <div id="pairing">
      <label for="token">Pairing token</label>
      <input id="token" type="password" placeholder="paste token" autocomplete="off" />
      <label for="port">Port</label>
      <input id="port" type="number" value="8766" />
      <div class="row">
        <button class="primary" id="pair">Pair</button>
      </div>
    </div>

    <div class="section">
      <h2>Tabs shared with the agent</h2>
      <ul id="tabs"></ul>
      <div class="row" style="margin-top: 8px">
        <button id="share">Share this tab</button>
      </div>
    </div>

    <p class="hint">
      The agent can only see the tabs listed above. Get the token with
      <code>npx tsx src/scripts/browser-pair.ts</code>.
    </p>

    <script src="popup.js"></script>
  </body>
</html>

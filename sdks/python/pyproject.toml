[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-client"
version = "0.1.0"
description = "Python client for the coding-agent backend (skills + chat over HTTP, with local JWT minting)."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.28",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_client*"]

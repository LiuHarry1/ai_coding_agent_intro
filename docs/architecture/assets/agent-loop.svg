<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Coding Agent turn host and query loop based on the current implementation">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8" fill="#64748b"/>
    </marker>
    <marker id="arrow-indigo" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8" fill="#4f46e5"/>
    </marker>
    <marker id="arrow-green" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8" fill="#059669"/>
    </marker>
    <filter id="shadow" x="-5%" y="-8%" width="110%" height="116%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="host" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="620" rx="18" fill="#f8fafc"/>

  <text x="36" y="40" font-size="22" font-weight="700" fill="#0f172a">Coding Agent Loop</text>
  <text x="36" y="62" font-size="12" fill="#64748b">One user turn can contain multiple model and tool steps</text>

  <!-- Entry -->
  <rect x="36" y="90" width="170" height="58" rx="12" fill="#ffffff" stroke="#cbd5e1" filter="url(#shadow)"/>
  <text x="121" y="124" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">User message</text>

  <path d="M206 119 L254 119" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Turn host -->
  <rect x="266" y="82" width="698" height="112" rx="15" fill="url(#host)" filter="url(#shadow)"/>
  <text x="290" y="110" font-size="15" font-weight="700" fill="#ffffff">runChatTurn() - turn host</text>

  <rect x="290" y="126" width="190" height="46" rx="9" fill="#ffffff" fill-opacity="0.18" stroke="#c7d2fe"/>
  <text x="385" y="145" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">prepareChatTurn()</text>
  <text x="385" y="160" text-anchor="middle" font-size="9.5" fill="#e0e7ff">Rules, tools, backend</text>

  <path d="M480 149 L518 149" stroke="#e0e7ff" stroke-width="1.7" marker-end="url(#arrow)"/>

  <rect x="530" y="126" width="176" height="46" rx="9" fill="#ffffff" fill-opacity="0.18" stroke="#c7d2fe"/>
  <text x="618" y="145" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">Memory recall</text>
  <text x="618" y="160" text-anchor="middle" font-size="9.5" fill="#e0e7ff">Attach if relevant</text>

  <path d="M706 149 L744 149" stroke="#e0e7ff" stroke-width="1.7" marker-end="url(#arrow)"/>

  <rect x="756" y="126" width="180" height="46" rx="9" fill="#ffffff" fill-opacity="0.18" stroke="#c7d2fe"/>
  <text x="846" y="153" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">query()</text>

  <path d="M846 194 L846 224 L500 224 L500 248" fill="none" stroke="#4f46e5" stroke-width="2" marker-end="url(#arrow-indigo)"/>

  <!-- Query loop -->
  <rect x="36" y="252" width="928" height="244" rx="16" fill="#ffffff" stroke="#a5b4fc" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="58" y="281" font-size="12" font-weight="700" fill="#4338ca">QUERY LOOP - repeats one step at a time</text>

  <rect x="62" y="312" width="190" height="82" rx="12" fill="#fef3c7" stroke="#d97706"/>
  <text x="157" y="341" text-anchor="middle" font-size="14" font-weight="700" fill="#92400e">preTurn()</text>
  <text x="157" y="363" text-anchor="middle" font-size="10.5" fill="#a16207">Project active history</text>
  <text x="157" y="379" text-anchor="middle" font-size="10.5" fill="#a16207">Compact if needed</text>

  <path d="M252 353 L294 353" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="306" y="302" width="250" height="102" rx="12" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="431" y="331" text-anchor="middle" font-size="14" font-weight="700" fill="#1d4ed8">runStep()</text>
  <text x="431" y="353" text-anchor="middle" font-size="10.5" fill="#2563eb">Stream model response</text>
  <text x="431" y="370" text-anchor="middle" font-size="10.5" fill="#2563eb">Execute requested tools</text>
  <text x="431" y="387" text-anchor="middle" font-size="10.5" fill="#2563eb">Append assistant + tool messages</text>

  <path d="M556 353 L598 353" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="610" y="312" width="190" height="82" rx="12" fill="#ecfdf5" stroke="#10b981"/>
  <text x="705" y="341" text-anchor="middle" font-size="14" font-weight="700" fill="#047857">postTurn()</text>
  <text x="705" y="363" text-anchor="middle" font-size="10.5" fill="#059669">Memory + attachments</text>
  <text x="705" y="379" text-anchor="middle" font-size="10.5" fill="#059669">Activate discovered tools</text>

  <path d="M800 353 L836 353" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <path d="M886 308 L936 353 L886 398 L836 353 Z" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="886" y="347" text-anchor="middle" font-size="10.5" font-weight="700" fill="#5b21b6">Tool calls?</text>
  <text x="886" y="364" text-anchor="middle" font-size="9.5" fill="#7c3aed">query decides</text>

  <!-- Continue path -->
  <path d="M886 308 L886 286 L157 286 L157 306" fill="none" stroke="#4f46e5" stroke-width="2" marker-end="url(#arrow-indigo)"/>
  <text x="833" y="279" font-size="10.5" font-weight="700" fill="#4f46e5">Yes: next step</text>

  <!-- Special cases -->
  <rect x="72" y="426" width="398" height="46" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="5 4"/>
  <text x="90" y="445" font-size="10.5" font-weight="700" fill="#475569">Inside runStep():</text>
  <text x="90" y="461" font-size="9.5" fill="#64748b">Context error: compact once and retry | transient error: bounded retry</text>

  <rect x="500" y="426" width="418" height="46" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="5 4"/>
  <text x="518" y="445" font-size="10.5" font-weight="700" fill="#475569">No tools exception:</text>
  <text x="518" y="461" font-size="9.5" fill="#64748b">An approved plan can force one implementation step</text>

  <!-- Finish -->
  <path d="M936 353 L976 353 L976 532 L836 532" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="944" y="339" font-size="10.5" font-weight="700" fill="#059669">No</text>

  <rect x="590" y="510" width="246" height="72" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="713" y="537" text-anchor="middle" font-size="14" font-weight="700" fill="#047857">Finalize query</text>
  <text x="713" y="559" text-anchor="middle" font-size="10.5" fill="#059669">Turn-end hooks + final text</text>

  <path d="M590 546 L542 546" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="248" y="510" width="282" height="72" rx="12" fill="#ffffff" stroke="#cbd5e1" filter="url(#shadow)"/>
  <text x="389" y="537" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">runChatTurn() completes</text>
  <text x="389" y="559" text-anchor="middle" font-size="10.5" fill="#64748b">Persist messages + close wire</text>

  <path d="M248 546 L200 546" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="36" y="517" width="152" height="58" rx="12" fill="#0f172a" filter="url(#shadow)"/>
  <text x="112" y="551" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Client result</text>

  <text x="964" y="606" text-anchor="end" font-size="9.5" fill="#94a3b8">Abort, error, and max-steps use explicit finalize paths</text>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1100 650" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Browser Automation Agent login verification example">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8" fill="#64748b"/>
    </marker>
    <marker id="arrow-indigo" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8" fill="#4f46e5"/>
    </marker>
    <filter id="shadow" x="-5%" y="-8%" width="110%" height="116%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="request" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>

  <rect width="1100" height="650" rx="18" fill="#f8fafc"/>

  <text x="40" y="42" font-size="22" font-weight="700" fill="#0f172a">Browser Automation - Login Example</text>
  <text x="40" y="65" font-size="12" fill="#64748b">One request, four tool steps, evidence-based verification</text>

  <!-- User request -->
  <rect x="40" y="88" width="1020" height="70" rx="14" fill="url(#request)" filter="url(#shadow)"/>
  <text x="65" y="116" font-size="12" font-weight="700" fill="#ffffff">USER REQUEST</text>
  <text x="65" y="140" font-size="13" fill="#eef2ff">Open localhost:5173/login, sign in with test@example.com, and verify that login succeeds.</text>

  <!-- Timeline -->
  <rect x="40" y="188" width="480" height="368" rx="16" fill="#ffffff" stroke="#cbd5e1" filter="url(#shadow)"/>
  <text x="64" y="218" font-size="13" font-weight="700" fill="#475569">AGENT EXECUTION FLOW</text>

  <circle cx="84" cy="262" r="21" fill="#eef2ff" stroke="#6366f1"/>
  <text x="84" y="267" text-anchor="middle" font-size="13" font-weight="700" fill="#4338ca">1</text>
  <rect x="122" y="236" width="366" height="52" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="142" y="257" font-size="12" font-weight="700" fill="#4338ca">browser_navigate</text>
  <text x="142" y="277" font-size="10.5" fill="#64748b">Open /login and receive a snapshot</text>

  <path d="M84 283 L84 315" stroke="#94a3b8" stroke-width="1.7" marker-end="url(#arrow)"/>

  <circle cx="84" cy="342" r="21" fill="#eef2ff" stroke="#6366f1"/>
  <text x="84" y="347" text-anchor="middle" font-size="13" font-weight="700" fill="#4338ca">2</text>
  <rect x="122" y="316" width="366" height="52" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="142" y="337" font-size="12" font-weight="700" fill="#4338ca">browser_fill_form</text>
  <text x="142" y="357" font-size="10.5" fill="#64748b">Fill email e3 and password e5</text>

  <path d="M84 363 L84 395" stroke="#94a3b8" stroke-width="1.7" marker-end="url(#arrow)"/>

  <circle cx="84" cy="422" r="21" fill="#eef2ff" stroke="#6366f1"/>
  <text x="84" y="427" text-anchor="middle" font-size="13" font-weight="700" fill="#4338ca">3</text>
  <rect x="122" y="396" width="366" height="52" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="142" y="417" font-size="12" font-weight="700" fill="#4338ca">browser_click</text>
  <text x="142" y="437" font-size="10.5" fill="#64748b">Click Sign in with ref e7</text>

  <path d="M84 443 L84 475" stroke="#94a3b8" stroke-width="1.7" marker-end="url(#arrow)"/>

  <circle cx="84" cy="502" r="21" fill="#ecfdf5" stroke="#10b981"/>
  <text x="84" y="507" text-anchor="middle" font-size="13" font-weight="700" fill="#047857">4</text>
  <rect x="122" y="476" width="366" height="52" rx="10" fill="#ecfdf5" stroke="#10b981"/>
  <text x="142" y="497" font-size="12" font-weight="700" fill="#047857">Verify fresh evidence</text>
  <text x="142" y="517" font-size="10.5" fill="#059669">Read the new snapshot and network state</text>

  <!-- Snapshot -->
  <rect x="560" y="188" width="500" height="368" rx="16" fill="#ffffff" stroke="#cbd5e1" filter="url(#shadow)"/>
  <text x="584" y="218" font-size="13" font-weight="700" fill="#475569">PAGE SNAPSHOT</text>

  <rect x="584" y="236" width="452" height="196" rx="12" fill="#ffffff" stroke="#94a3b8"/>
  <rect x="584" y="236" width="452" height="34" rx="12" fill="#e2e8f0"/>
  <circle cx="604" cy="253" r="5" fill="#ef4444"/>
  <circle cx="620" cy="253" r="5" fill="#f59e0b"/>
  <circle cx="636" cy="253" r="5" fill="#10b981"/>
  <rect x="662" y="244" width="350" height="18" rx="9" fill="#ffffff"/>
  <text x="676" y="257" font-size="9.5" fill="#64748b">localhost:5173/login</text>

  <text x="606" y="300" font-size="14" font-weight="700" fill="#0f172a">Sign in</text>

  <rect x="606" y="316" width="408" height="30" rx="7" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="620" y="336" font-size="10.5" fill="#475569">Email</text>
  <rect x="962" y="321" width="38" height="20" rx="10" fill="#eef2ff"/>
  <text x="981" y="335" text-anchor="middle" font-size="9.5" font-weight="700" fill="#4338ca">e3</text>

  <rect x="606" y="354" width="408" height="30" rx="7" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="620" y="374" font-size="10.5" fill="#475569">Password</text>
  <rect x="962" y="359" width="38" height="20" rx="10" fill="#eef2ff"/>
  <text x="981" y="373" text-anchor="middle" font-size="9.5" font-weight="700" fill="#4338ca">e5</text>

  <rect x="606" y="392" width="408" height="30" rx="7" fill="#4f46e5"/>
  <text x="810" y="412" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff">Sign in</text>
  <rect x="962" y="397" width="38" height="20" rx="10" fill="#ffffff" fill-opacity="0.9"/>
  <text x="981" y="411" text-anchor="middle" font-size="9.5" font-weight="700" fill="#4338ca">e7</text>

  <path d="M810 422 L810 450" stroke="#4f46e5" stroke-width="1.8" marker-end="url(#arrow-indigo)"/>

  <!-- Outcomes -->
  <rect x="584" y="458" width="138" height="70" rx="10" fill="#ecfdf5" stroke="#10b981"/>
  <text x="653" y="481" text-anchor="middle" font-size="11.5" font-weight="700" fill="#047857">SUCCESS</text>
  <text x="653" y="502" text-anchor="middle" font-size="9.5" fill="#059669">Welcome back</text>
  <text x="653" y="517" text-anchor="middle" font-size="9" fill="#059669">in snapshot</text>

  <rect x="739" y="458" width="138" height="70" rx="10" fill="#fef2f2" stroke="#ef4444"/>
  <text x="808" y="481" text-anchor="middle" font-size="11.5" font-weight="700" fill="#b91c1c">UI ERROR</text>
  <text x="808" y="502" text-anchor="middle" font-size="9.5" fill="#dc2626">Message visible</text>
  <text x="808" y="517" text-anchor="middle" font-size="9" fill="#dc2626">in snapshot</text>

  <rect x="894" y="458" width="142" height="70" rx="10" fill="#fff7ed" stroke="#f97316"/>
  <text x="965" y="481" text-anchor="middle" font-size="11.5" font-weight="700" fill="#c2410c">HIDDEN ERROR</text>
  <text x="965" y="502" text-anchor="middle" font-size="9.5" fill="#ea580c">POST /api/login</text>
  <text x="965" y="517" text-anchor="middle" font-size="9" fill="#ea580c">fails in network</text>

  <!-- Footer -->
  <rect x="40" y="586" width="1020" height="38" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="550" y="610" text-anchor="middle" font-size="10.5" font-weight="700" fill="#475569">Localhost: isolated mode | Signed-in admin site: extension mode</text>
</svg>

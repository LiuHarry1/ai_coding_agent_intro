  <text x="556" y="666" font-size="11" font-weight="700" fill="#5b21b6">Operable — Enterprise Controls</text>
  <text x="556" y="684" font-size="10" fill="#6d28d9">Central policies · Identity · Workspace isolation · Usage and cost</text>

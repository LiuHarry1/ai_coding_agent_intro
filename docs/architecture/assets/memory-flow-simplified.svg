<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 995" width="900" height="995" role="img" aria-label="Memory flow when a new message arrives">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="995" fill="#ffffff"/>

  <text x="330" y="34" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#0f172a">Memory Flow: One Message</text>
  <text x="330" y="54" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#64748b">read on the way in, write on the way out</text>

  <!-- new message -->
  <rect x="240" y="76" width="180" height="38" rx="19" fill="#0f172a"/>
  <text x="330" y="101" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">New message</text>
  <path d="M330 114 L330 132" stroke="#64748b" stroke-width="1.8" marker-end="url(#a)"/>

  <!-- 1 prepare -->
  <rect x="60" y="134" width="540" height="68" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <circle cx="84" cy="158" r="11" fill="#0f172a"/>
  <text x="84" y="162" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff">1</text>
  <text x="102" y="163" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#334155">Prepare</text>

  <rect x="176" y="146" width="126" height="28" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.2"/>
  <text x="239" y="164" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#4338ca">Project Rules</text>

  <rect x="314" y="146" width="150" height="28" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
  <text x="389" y="164" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#047857">Auto Memory guide</text>

  <path d="M464 160 L482 160" stroke="#64748b" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="486" y="146" width="108" height="28" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="540" y="164" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#334155">system prompt</text>

  <path d="M330 202 L330 214" stroke="#64748b" stroke-width="1.8" marker-end="url(#a)"/>

  <!-- 2 recall -->
  <rect x="60" y="218" width="540" height="182" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <circle cx="84" cy="242" r="11" fill="#0f172a"/>
  <text x="84" y="246" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff">2</text>
  <text x="102" y="247" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#334155">Recall</text>

  <rect x="84" y="268" width="140" height="38" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.3"/>
  <text x="154" y="292" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#047857">Fast lane</text>

  <path d="M224 287 L240 287" stroke="#64748b" stroke-width="1.4" marker-end="url(#a)"/>

  <path d="M292 261 L340 287 L292 313 L244 287 Z" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="292" y="291" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#334155">strong hit?</text>

  <path d="M340 287 L372 287" stroke="#64748b" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="356" y="280" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#64748b">no</text>

  <rect x="376" y="268" width="180" height="38" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.3" stroke-dasharray="5 3"/>
  <text x="466" y="292" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#047857">Semantic lane</text>

  <path d="M292 313 L292 336 L330 336 L330 346" fill="none" stroke="#64748b" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="276" y="330" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#64748b">yes</text>
  <path d="M466 306 L466 336 L330 336" fill="none" stroke="#64748b" stroke-width="1.4"/>

  <rect x="236" y="350" width="188" height="28" rx="14" fill="#d1fae5" stroke="#059669" stroke-width="1.2"/>
  <text x="330" y="368" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#047857">relevant_memories</text>

  <path d="M330 400 L330 414" stroke="#64748b" stroke-width="1.8" marker-end="url(#a)"/>

  <!-- 3 each step -->
  <rect x="60" y="418" width="540" height="92" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
  <circle cx="84" cy="442" r="11" fill="#0f172a"/>
  <text x="84" y="446" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff">3</text>
  <text x="102" y="447" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#334155">Each step (repeats)</text>

  <rect x="84" y="462" width="120" height="36" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.3"/>
  <text x="144" y="485" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#b45309">Compact</text>

  <path d="M204 480 L222 480" stroke="#64748b" stroke-width="1.4" marker-end="url(#a)"/>

  <rect x="226" y="462" width="130" height="36" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="291" y="485" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#334155">Model + tools</text>

  <path d="M356 480 L374 480" stroke="#64748b" stroke-width="1.4" marker-end="url(#a)"/>

  <rect x="378" y="462" width="150" height="36" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.3"/>
  <text x="453" y="485" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0369a1">Session Memory</text>

  <path d="M330 510 L330 524" stroke="#64748b" stroke-width="1.8" marker-end="url(#a)"/>

  <!-- compact escalation -->
  <rect x="60" y="528" width="540" height="202" rx="12" fill="#fffdf7" stroke="#d97706" stroke-width="1.5"/>
  <text x="84" y="552" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#b45309">Compact escalates, stops as soon as it fits</text>

  <rect x="84" y="566" width="190" height="38" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.3"/>
  <text x="102" y="590" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#b45309">A</text>
  <text x="188" y="590" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#b45309">Micro</text>

  <path d="M179 604 L179 622" stroke="#64748b" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="192" y="618" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#64748b">still too big</text>

  <rect x="84" y="624" width="190" height="38" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.3"/>
  <text x="102" y="648" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#0369a1">B</text>
  <text x="190" y="648" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0369a1">Session Memory compact</text>

  <path d="M179 662 L179 680" stroke="#64748b" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="192" y="676" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#64748b">notes unusable</text>

  <rect x="84" y="682" width="190" height="38" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.3"/>
  <text x="102" y="706" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#b45309">C</text>
  <text x="190" y="706" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#b45309">Full LLM compact</text>

  <path d="M330 730 L330 744" stroke="#64748b" stroke-width="1.8" marker-end="url(#a)"/>

  <!-- 4 turn end -->
  <rect x="60" y="748" width="540" height="62" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <circle cx="84" cy="772" r="11" fill="#0f172a"/>
  <text x="84" y="776" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff">4</text>
  <text x="102" y="777" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#334155">Turn ends</text>

  <rect x="210" y="760" width="190" height="28" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
  <text x="305" y="778" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#047857">Auto Memory extract</text>

  <!-- stores -->
  <text x="765" y="222" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#64748b">where it is stored</text>

  <rect x="660" y="244" width="210" height="80" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.8"/>
  <text x="765" y="270" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#047857">Auto Memory</text>
  <text x="765" y="289" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#334155">topic files in the project folder</text>
  <text x="765" y="306" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#64748b">shared by every chat</text>

  <rect x="660" y="600" width="210" height="80" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.8"/>
  <text x="765" y="626" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0369a1">Session Memory</text>
  <text x="765" y="645" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#334155">summary.md</text>
  <text x="765" y="662" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#64748b">this chat only</text>

  <!-- store arrows -->
  <path d="M656 284 L604 284" stroke="#059669" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="630" y="277" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#047857">read</text>

  <path d="M600 779 L884 779 L884 300 L874 300" fill="none" stroke="#059669" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="700" y="773" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#047857">write</text>

  <path d="M528 480 L620 480 L620 620 L656 620" fill="none" stroke="#0284c7" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="632" y="474" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#0369a1">write</text>

  <path d="M656 643 L278 643" stroke="#0284c7" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="430" y="637" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#0369a1">read</text>

  <!-- legend -->
  <line x1="60" y1="838" x2="870" y2="838" stroke="#e2e8f0" stroke-width="1"/>
  <g font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#334155">
    <text x="60" y="860"><tspan font-weight="700">1 Prepare</tspan>  -  AGENTS.md and the other rule files, plus a short how-to-use-memory text, go into the system prompt every turn.</text>
    <text x="60" y="878"><tspan font-weight="700">2 Recall</tspan>  -  the fast lane keyword-matches names and descriptions. A confident match wins outright; otherwise a small model picks.</text>
    <text x="60" y="896"><tspan font-weight="700">3 Each step</tspan>  -  shrink the context, let the model work, then jot notes on this chat. Only the notes reach the disk.</text>
    <text x="60" y="914"><tspan font-weight="700">4 Turn ends</tspan>  -  a side task saves durable facts as topic files so the next chat can recall them.</text>
    <text x="60" y="936"><tspan font-weight="700">A / B / C</tspan>  -  Micro only deletes old tool output, no model. B reuses the step-3 notes as the summary.</text>
    <text x="60" y="952">C makes the model rewrite the whole history, and is the last resort.</text>
    <text x="60" y="974"><tspan font-weight="700">Two stores</tspan>  -  Session Memory is this chat's scratchpad and only feeds compaction. Auto Memory is long-term and compaction never touches it.</text>
  </g>
</svg>
